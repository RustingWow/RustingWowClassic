apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  ports:
    - name: world
      port: 8085
      targetPort: 8085
      protocol: TCP
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: wowserver:latest
          imagePullPolicy: IfNotPresent
          command: ["gateway"]
          env:
            - name: WORLD_BIND
              value: "0.0.0.0:8085"
            - name: AUTH_INTERNAL_URL
              value: "http://auth-internal:9090"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: SHARDS_FILE
              value: "/etc/wow/shards.yaml"
            - name: MAP_ENDPOINTS
              value: "0=map-eastern-kingdoms:9100,1=map-kalimdor:9100"
          ports:
            - containerPort: 8085
